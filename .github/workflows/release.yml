name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (defaults to manifest.json's version)"
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(jq -r .version custom_components/apple_device_latest_version/manifest.json)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Sync manifest.json version
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            custom_components/apple_device_latest_version/manifest.json > /tmp/manifest.json
          mv /tmp/manifest.json custom_components/apple_device_latest_version/manifest.json

      - name: Commit version bump (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- custom_components/apple_device_latest_version/manifest.json; then
            git add custom_components/apple_device_latest_version/manifest.json
            git commit -m "Bump version to ${{ steps.version.outputs.version }}"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build release zip
        run: |
          cd custom_components/apple_device_latest_version
          zip -r "${GITHUB_WORKSPACE}/apple_device_latest_version.zip" .

      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          files: apple_device_latest_version.zip
          generate_release_notes: true
